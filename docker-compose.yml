services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-openai-gateway:latest
    container_name: claude-openai-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-5175}:5175"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5175
