services:
  gateway:
    build: .
    image: claude-gateway:latest
    container_name: claude-gateway
    restart: unless-stopped
    init: true # forwards SIGTERM so in-flight streams finish and usage is saved
    ports:
      # Loopback by default; put `tailscale serve` in front, or set DOCKER_BIND to
      # the server's Tailscale IP (100.x.y.z). Never 0.0.0.0 on a public server.
      - "${DOCKER_BIND:-127.0.0.1}:${DOCKER_PORT:-5175}:8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - gateway-data:/data # connections, routes, client keys, admin password

volumes:
  gateway-data:
